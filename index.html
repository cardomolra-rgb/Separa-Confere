<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Separa &amp; Confere</title>
<meta name="description" content="Separação e conferência de pedidos sem papel.">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#242424" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Separa">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="/logo.svg">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/app.css?v=2">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html,body{margin:0}body{font-size:15px;-webkit-tap-highlight-color:transparent}img{max-width:100%}</style>
</head>
<body>
<header class="top"><div class="in">
  <div class="brand"><svg viewBox="0 0 512 512" aria-hidden="true"><g stroke-linejoin="round" stroke-width="10"><path transform="translate(0,-8)" fill="#F47B20" stroke="#F47B20" fill-rule="evenodd" d="M256 60 L425 158 L256 256 L87 158 Z M256 124 L311 156 L256 188 L201 156 Z"/><path transform="translate(-7,4)" style="fill:var(--logo-dark);stroke:var(--logo-dark)" d="M87 162 L252 258 L252 450 L87 354 Z"/><path transform="translate(7,4)" fill="#F47B20" stroke="#F47B20" d="M425 162 L260 258 L260 450 L425 354 Z"/></g></svg><span>Separa <b>&amp;</b> Confere</span></div>
  <button class="opbtn" id="opBtn" aria-haspopup="dialog" aria-label="Menu do usuário" hidden></button>
</div></header>
<main class="wrap"><div class="net" id="net" hidden>Sem conexão. O que você fizer fica guardado neste aparelho e é enviado quando a internet voltar.</div><div id="app"></div></main>
<div class="footer" id="footer" hidden><div class="in" id="footerIn"></div></div>
<div class="toast" id="toast" hidden></div>
<div class="sheet-bg" id="opSheet" hidden><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="opTit">
  <div class="grip"></div><div class="lbl" id="opTit">Conectado como</div>
  <div class="oplist" id="opList"></div>
  <div style="display:grid;gap:8px"><button class="btn ghost" id="opEdit">Operadores e PINs</button><button class="btn" id="opSair">Sair / trocar usuário</button></div>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" crossorigin="anonymous"></script>
<div class="sheet-bg" id="cfSheet" hidden><div class="sheet" role="alertdialog" aria-modal="true" aria-labelledby="cfTit">
  <div class="grip"></div><h2 id="cfTit"></h2><p class="cf-txt" id="cfTxt"></p>
  <div class="cf-acts"><button class="btn ghost" id="cfNao">Cancelar</button><button class="btn" id="cfSim">Confirmar</button></div>
</div></div>
<script src="/app.js?v=2"></script>
</body>
</html>
